name: Release

# Tag a commit (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to build a
# universal ActionsHub.app, package it as a .dmg, and publish a GitHub Release
# with the .dmg attached. The version comes from the tag (v0.1.0 → 0.1.0).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Build universal .dmg
        run: |
          VERSION="${GITHUB_REF_NAME#v}" \
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}" \
          ARCHS="arm64 x86_64" \
          ./package.sh

      - name: Verify universal binary
        run: lipo -info dist/ActionsHub.app/Contents/MacOS/ActionsHub

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "ActionsHub ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/ActionsHub-*.dmg
